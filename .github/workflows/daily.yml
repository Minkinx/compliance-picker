name: 数据合规日报

on:
  schedule:
    # 每天 UTC 1:55 ≈ 北京时间 9:55
    - cron: "55 1 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 抓取并推送合规资讯
        run: python crawler.py
        env:
          FEISHU_KEY: ${{ secrets.FEISHU_KEY }}
          WECOM_KEY: ${{ secrets.WECOM_KEY }}
          DINGTALK_KEY: ${{ secrets.DINGTALK_KEY }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          MAIL_KEY: ${{ secrets.MAIL_KEY }}
          MAIL_RECEIVER: ${{ secrets.MAIL_RECEIVER }}

      - name: 创建 GitHub Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "[数据合规日报] $(date -d '-1 day' '+%Y-%m-%d')" \
            --body "$(cat today.md)" \
            --label "daily" 2>/dev/null || true

      - name: 提交归档
        run: |
          git config user.name "compliance-bot"
          git config user.email "compliance-bot@users.noreply.github.com"
          git add archive/ today.md
          git commit -m "数据合规日报（$(date -d '-1 day' '+%Y-%m-%d')）" 2>/dev/null || echo "没有新内容"
          git push
